  <main class="page container">
    <h1 class="page__title">Contacto</h1>
    <p class="page__lead reveal">Busco prácticas donde seguir aprendiendo. Escríbeme y te respondo lo antes posible.</p>

    <div class="contact">
      <!-- novalidate: la validación la hace main.js para mostrar mensajes propios -->
      <form id="form" class="form reveal" novalidate>
        <div class="field">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" autocomplete="name" required>
          <small class="error" aria-live="polite"></small>
        </div>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
          <small class="error" aria-live="polite"></small>
        </div>
        <div class="field">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
          <small class="error" aria-live="polite"></small>
        </div>
        <button type="submit" class="btn btn--primary">Enviar mensaje</button>
        <p class="form__status" role="status"></p>
      </form>

      <!-- Enlaces directos -->
      <aside class="links">
        <a class="card tilt reveal" href="https://www.linkedin.com/in/juanma-rosado-trujillo-b841962b5" target="_blank" rel="noopener"><h3>LinkedIn</h3><p>juanma-rosado-trujillo</p></a>
        <a class="card tilt reveal" href="https://github.com/Juanma-Rosado" target="_blank" rel="noopener"><h3>GitHub</h3><p>Juanma-Rosado</p></a>
        <a class="card tilt reveal" href="mailto:rosadotrujillojuanma@gmail.com"><h3>Correo</h3><p>rosadotrujillojuanma@gmail.com</p></a>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <p>© <span id="year"></span> Juanma Rosado</p>

    </p>
  </footer>
