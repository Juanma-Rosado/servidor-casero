dir: local
	path /var/lib/vz
	content import,backup,iso,vztmpl

lvmthin: local-lvm
	thinpool data
	vgname pve
	content rootdir,images

zfspool: datos
	pool datos
	content images,rootdir
	mountpoint /datos
	nodes pve

dir: backups
	path /datos/backups
	content backup
	prune-backups keep-last=2,keep-weekly=2

