matcher: default-matcher
	comment Todos los avisos a Telegram (Gmail rechaza el correo enviado directamente desde casa)
	mode all
	target telegram

smtp: email
	disable true
	from-address correo@ejemplo.com
	mailto-user root@pam
	mode starttls
