# Túnel de Cloudflare (LXC 101): publica la web sin abrir puertos del router.
# El token del túnel está en el .env del servidor.
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file: .env
