<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Imagen para redes (og.png)</title>
  <!-- Plantilla de la imagen que sale al compartir la web (1200 × 630).
       La convierte en PNG scripts/generar-imagenes.sh. -->
  <link rel="stylesheet" href="../../web/portfolio/comun/css/fonts.css">
  <style>
    body {
      width: 1200px;
      height: 630px;
      margin: 0;
      padding: 60px 90px 50px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      font-family: "IBM Plex Sans", sans-serif;
      color: #1f1d1a;
      background: #f6f3ec;
      /* La misma raya roja que el subrayado del menú de la web */
      border-top: 14px solid #b0442a;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 84px;
      font-weight: 600;
      line-height: 1.1;
    }

    .dato {
      margin: 0 0 36px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 28px;
      color: #6b665e;
    }

    ul {
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 32px;
    }

    li {
      display: flex;
      gap: 32px;
      padding: 12px 0;
      border-top: 2px dashed #dcd5c8;
    }

    li:last-child {
      border-bottom: 2px dashed #dcd5c8;
    }

    time {
      width: 150px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 26px;
      line-height: 1.5;
      color: #6b665e;
    }

    .web {
      margin: auto 0 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 28px;
      color: #b0442a;
    }
  </style>
</head>
<body>
  <h1>Juanma Rosado</h1>
  <p class="dato">Málaga · Estudiante de DAW · Busco prácticas</p>
  <ul>
    <li><time>Nov 2026</time>Windows 11 y Linux Mint en la misma máquina</li>
    <li><time>Oct 2026</time>Mi servidor casero con Proxmox</li>
    <li><time>May 2026</time>Reserfy, reservas para restaurantes</li>
  </ul>
  <p class="web">juanmarosado.com</p>
</body>
</html>
