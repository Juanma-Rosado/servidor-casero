<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Reserfy{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #222222;
      --border: #2e2e2e;
      --accent: #c0392b;
      --accent-light: #e74c3c;
      --accent-dim: rgba(192,57,43,0.15);
      --text: #f0ede8;
      --text-muted: #888;
      --text-dim: #555;
      --success: #27ae60;
      --warning: #f39c12;
      --radius: 12px;
      --radius-sm: 8px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* Navbar */
    .navbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .navbar-logo {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .navbar-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.3rem;
      color: var(--text);
    }

    .navbar-title span {
      color: var(--accent);
    }

    .navbar-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .navbar-restaurant {
      font-size: 0.85rem;
      color: var(--text-muted);
      padding: 4px 12px;
      background: var(--surface2);
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .btn-logout {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      transition: all 0.2s;
    }

    .btn-logout:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Main */
    .main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2.5rem 2rem;
    }

    /* Botones */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      text-decoration: none;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-light);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-danger {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .btn-danger:hover {
      background: var(--accent);
      color: #fff;
    }

    /* Badges de estado */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 500;
    }

    .badge-ok {
      background: rgba(39,174,96,0.15);
      color: #2ecc71;
      border: 1px solid rgba(39,174,96,0.3);
    }

    .badge-cancelada {
      background: rgba(192,57,43,0.15);
      color: var(--accent-light);
      border: 1px solid rgba(192,57,43,0.3);
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    {% block extra_styles %}{% endblock %}
  </style>
</head>
<body>
  {% if session.logged_in %}
  <nav class="navbar">
    <a href="/reservas" class="navbar-brand">
      <div class="navbar-logo">🍽️</div>
      <span class="navbar-title">Reser<span>fy</span></span>
    </a>
    <div class="navbar-right">
      <span class="navbar-restaurant">{{ restaurant }}</span>
      <a href="/logout" class="btn-logout">Cerrar sesión</a>
    </div>
  </nav>
  {% endif %}

  <main class="main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
