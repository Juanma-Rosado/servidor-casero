# Reserfy: proyecto final de 2.º SMR (IES Belén, curso 2025-2026), restaurado como demo.
# Equipo: Juanma Rosado y tres compañeros de clase.
#
# Piezas:
#   - web-reserfy: web corporativa de Reserfy (WordPress, tema Astra).
#   - web-restaurante: web del restaurante de ejemplo Échale Queso (WordPress, CF7 + Flamingo).
#   - gestion: aplicación Flask que lee y edita las reservas que guarda Flamingo.
#   - mailpit: atrapa todos los correos de la demo; nunca sale nada a internet.
#   - entrada: nginx que reparte las peticiones según el dominio.
#
# Solo "entrada" publica un puerto (8082), y el cortafuegos de la VM 103 solo deja
# llegar a NPM (192.168.0.252). Las bases de datos no publican ninguno.
# Versiones fijas: no usar latest. Recrear con: docker compose up -d --pull never
# Secretos en .env (plantilla en .env.ejemplo).

name: reserfy

services:

  entrada:
    image: nginx:1.31.8-alpine3.24
    container_name: reserfy-entrada
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      DOMINIO_RESERFY: ${DOMINIO_RESERFY}
      DOMINIO_RESTAURANTE: ${DOMINIO_RESTAURANTE}
      DOMINIO_GESTION: ${DOMINIO_GESTION}
    volumes:
      # La imagen de nginx sustituye las variables ${DOMINIO_*} al arrancar
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - web-reserfy
      - web-restaurante
      - gestion
    networks:
      - reserfy

  db-reserfy:
    image: mariadb:11.8.9
    container_name: reserfy-db-reserfy
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_RESERFY_ROOT_PASSWORD}
      MARIADB_DATABASE: reserfy_db
      MARIADB_USER: reserfy
      MARIADB_PASSWORD: ${DB_RESERFY_PASSWORD}
    volumes:
      - ./datos/db-reserfy:/var/lib/mysql
      # Solo se importa la primera vez, con la carpeta de datos vacía
      - ./bases/reserfy_db.sql:/docker-entrypoint-initdb.d/01-reserfy_db.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 2m
    networks:
      - reserfy

  db-restaurante:
    image: mariadb:11.8.9
    container_name: reserfy-db-restaurante
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_RESTAURANTE_ROOT_PASSWORD}
      MARIADB_DATABASE: restaurante_db
      MARIADB_USER: restaurante
      MARIADB_PASSWORD: ${DB_RESTAURANTE_PASSWORD}
      # La usa 02-usuario-gestion.sh para crear el usuario de la app Flask
      GESTION_DB_PASSWORD: ${GESTION_DB_PASSWORD}
    volumes:
      - ./datos/db-restaurante:/var/lib/mysql
      - ./bases/restaurante_db.sql:/docker-entrypoint-initdb.d/01-restaurante_db.sql:ro
      - ./bases/02-usuario-gestion.sh:/docker-entrypoint-initdb.d/02-usuario-gestion.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 2m
    networks:
      - reserfy

  web-reserfy:
    image: wordpress:7.1.3-php8.3-apache
    container_name: reserfy-web-reserfy
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: db-reserfy
      WORDPRESS_DB_NAME: reserfy_db
      WORDPRESS_DB_USER: reserfy
      WORDPRESS_DB_PASSWORD: ${DB_RESERFY_PASSWORD}
      WORDPRESS_AUTH_KEY: ${RESERFY_AUTH_KEY}
      WORDPRESS_SECURE_AUTH_KEY: ${RESERFY_SECURE_AUTH_KEY}
      WORDPRESS_LOGGED_IN_KEY: ${RESERFY_LOGGED_IN_KEY}
      WORDPRESS_NONCE_KEY: ${RESERFY_NONCE_KEY}
      WORDPRESS_AUTH_SALT: ${RESERFY_AUTH_SALT}
      WORDPRESS_SECURE_AUTH_SALT: ${RESERFY_SECURE_AUTH_SALT}
      WORDPRESS_LOGGED_IN_SALT: ${RESERFY_LOGGED_IN_SALT}
      WORDPRESS_NONCE_SALT: ${RESERFY_NONCE_SALT}
      WORDPRESS_CONFIG_EXTRA: &configuracion-extra |
        /* Correo: todo a Mailpit (WP Mail SMTP lee estas constantes antes que su configuracion guardada) */
        define('WPMS_ON', true);
        define('WPMS_MAILER', 'smtp');
        define('WPMS_SMTP_HOST', 'mailpit');
        define('WPMS_SMTP_PORT', 1025);
        define('WPMS_SSL', '');
        define('WPMS_SMTP_AUTH', false);
        define('WPMS_SMTP_AUTOTLS', false);
        /* Sin editor de temas y plugins desde el panel */
        define('DISALLOW_FILE_EDIT', true);
    depends_on:
      db-reserfy:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./datos/web-reserfy:/var/www/html
      - ./php/subidas.ini:/usr/local/etc/php/conf.d/subidas.ini:ro
    networks:
      - reserfy

  web-restaurante:
    image: wordpress:7.1.3-php8.3-apache
    container_name: reserfy-web-restaurante
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: db-restaurante
      WORDPRESS_DB_NAME: restaurante_db
      WORDPRESS_DB_USER: restaurante
      WORDPRESS_DB_PASSWORD: ${DB_RESTAURANTE_PASSWORD}
      WORDPRESS_AUTH_KEY: ${RESTAURANTE_AUTH_KEY}
      WORDPRESS_SECURE_AUTH_KEY: ${RESTAURANTE_SECURE_AUTH_KEY}
      WORDPRESS_LOGGED_IN_KEY: ${RESTAURANTE_LOGGED_IN_KEY}
      WORDPRESS_NONCE_KEY: ${RESTAURANTE_NONCE_KEY}
      WORDPRESS_AUTH_SALT: ${RESTAURANTE_AUTH_SALT}
      WORDPRESS_SECURE_AUTH_SALT: ${RESTAURANTE_SECURE_AUTH_SALT}
      WORDPRESS_LOGGED_IN_SALT: ${RESTAURANTE_LOGGED_IN_SALT}
      WORDPRESS_NONCE_SALT: ${RESTAURANTE_NONCE_SALT}
      WORDPRESS_CONFIG_EXTRA: *configuracion-extra
    depends_on:
      db-restaurante:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./datos/web-restaurante:/var/www/html
      - ./php/subidas.ini:/usr/local/etc/php/conf.d/subidas.ini:ro
    networks:
      - reserfy

  gestion:
    build: ./gestion
    image: reserfy-gestion:1.1
    container_name: reserfy-gestion
    restart: unless-stopped
    environment:
      DB_HOST: db-restaurante
      DB_PORT: 3306
      DB_USER: gestion
      DB_PASSWORD: ${GESTION_DB_PASSWORD}
      DB_NAME: restaurante_db
      SECRET_KEY: ${GESTION_SECRET_KEY}
      APP_USER: ${GESTION_USUARIO}
      APP_PASSWORD: ${GESTION_CONTRASENA}
      RESTAURANT_NAME: Échale Queso
    depends_on:
      db-restaurante:
        condition: service_healthy
    networks:
      - reserfy

  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: reserfy-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      # Solo dentro de la VM: se ve desde el PC con un túnel SSH (ssh -L 8025:127.0.0.1:8025 profesional)
      - "127.0.0.1:8025:8025"
    networks:
      - reserfy

  # Herramientas: no arrancan con "up". Uso: docker compose run --rm cli-reserfy wp plugin list
  cli-reserfy:
    image: wordpress:cli-2.11.0-php8.3
    profiles:
      - herramientas
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db-reserfy
      WORDPRESS_DB_NAME: reserfy_db
      WORDPRESS_DB_USER: reserfy
      WORDPRESS_DB_PASSWORD: ${DB_RESERFY_PASSWORD}
    volumes:
      - ./datos/web-reserfy:/var/www/html
    depends_on:
      - db-reserfy
    networks:
      - reserfy

  cli-restaurante:
    image: wordpress:cli-2.11.0-php8.3
    profiles:
      - herramientas
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db-restaurante
      WORDPRESS_DB_NAME: restaurante_db
      WORDPRESS_DB_USER: restaurante
      WORDPRESS_DB_PASSWORD: ${DB_RESTAURANTE_PASSWORD}
    volumes:
      - ./datos/web-restaurante:/var/www/html
    depends_on:
      - db-restaurante
    networks:
      - reserfy

networks:
  reserfy:
    name: reserfy
