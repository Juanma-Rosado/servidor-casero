[datos]
        use_template = estandar
        recursive = yes

[datos/backups]
        use_template = ninguno

# Peliculas de Jellyfin: se pueden recuperar, sin instantaneas
[datos/vm-102-disk-2]
        use_template = ninguno

[template_estandar]
        hourly = 24
        daily = 7
        weekly = 4
        monthly = 0
        autosnap = yes
        autoprune = yes

[template_ninguno]
        autosnap = no
        autoprune = no
