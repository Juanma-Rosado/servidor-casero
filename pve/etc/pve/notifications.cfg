matcher: default-matcher
	comment Todos los avisos a Telegram menos los de vzdump (Gmail rechaza el correo enviado directamente desde casa)
	invert-match true
	match-field exact:type=vzdump
	mode all
	target telegram

matcher: vzdump
	comment Copias de vzdump: a Telegram solo con el título
	match-field exact:type=vzdump
	mode all
	target telegram-corto

sendmail: mail-to-root
	comment Send mails to root@pam's email address
	mailto correo@ejemplo.com
	mailto-user root@pam

webhook: telegram
	body ***
	header ***
	method post
	url ***

webhook: telegram-corto
	body ***
	comment Solo el título: el mensaje de vzdump lleva el registro entero y Telegram no admite más de 4096 caracteres
	header ***
	method post
	url ***
