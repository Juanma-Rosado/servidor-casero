# Config propia del portfolio (antes usaba la de serie de la imagen nginx).
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # Redirecciones relativas (/servidor -> /servidor/): nginx esta detras de NPM y
    # Cloudflare y solo ve http, asi que las absolutas mandaban al visitante a http://
    absolute_redirect off;
    server_tokens off;

    # Cabeceras de seguridad. HSTS sin includeSubDomains para no afectar a *.casa
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

# www.juanmarosado.com -> juanmarosado.com (NPM reenvia el nombre original)
server {
    listen       80;
    listen  [::]:80;
    server_name  www.juanmarosado.com;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://juanmarosado.com$request_uri;
}
