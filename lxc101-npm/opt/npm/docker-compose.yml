# Nginx Proxy Manager (LXC 101): reparte las peticiones a cada servicio.
# El puerto 81 es el panel de administración.
services:
  npm:
    image: jc21/nginx-proxy-manager:2.16.0
    container_name: npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
